# ==============================================================================
# VM 5: Challenge Execution Host & Proxmox Orchestration (Container 119)
# Runs Traefik Ingress + Docker Socket API Proxy + Proxmox Provisioner Service
# ==============================================================================

networks:
  traefik_net:
    name: traefik_net
    driver: bridge

services:
  # ----------------------------------------------------------------------------
  # 1. Challenge Provisioner & Proxmox Orchestrator API
  # Responsible for creating Proxmox VMs / LXCs and Docker instances for CTF
  # ----------------------------------------------------------------------------
  challenge-orchestrator:
    build: .
    container_name: ctf_challenge_orchestrator
    restart: always
    ports:
      - "5050:5050"
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - traefik_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ----------------------------------------------------------------------------
  # 2. Traefik v3 Dynamic Ingress Proxy
  # Automatically detects dynamically spawned student containers on this VM
  # ----------------------------------------------------------------------------
  traefik:
    image: traefik:v3.1
    container_name: ctf_traefik_vm5
    restart: always
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik_net
    ports:
      - "80:80"       # HTTP Ingress for student challenges
      - "443:443"     # HTTPS Ingress
      - "8080:8080"   # Traefik Dashboard (admin/monitoring)
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dash.rule=Host(`traefik.ctf.local`)"
      - "traefik.http.routers.dash.service=api@internal"
      - "traefik.http.services.dash.loadbalancer.server.port=8080"

  # ----------------------------------------------------------------------------
  # 3. Remote Docker Socket Proxy
  # Exposes a sanitized Docker API on port 2375 over internal network to VM 3
  # ----------------------------------------------------------------------------
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: ctf_remote_socket_proxy
    restart: always
    environment:
      CONTAINERS: 1
      POST: 1
      DELETE: 1
      NETWORKS: 1
      INFO: 1
      VERSION: 1
      VOLUMES: 0
      SWARM: 0
      SECRETS: 0
      NODES: 0
      SERVICES: 0
      SYSTEM: 0
      EXEC: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "2375:2375"
    networks:
      - traefik_net
